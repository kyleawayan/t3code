name: Desktop macOS Fork Preview

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read

# Build events and cleanup events use separate groups: a push must cancel a
# stale in-flight build, but must never cancel a cleanup run mid-delete. The
# publish job re-checks PR state before uploading to cover the reverse race.
concurrency:
  group: desktop-macos-preview-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["closed", "unlabeled"]'), github.event.action) && 'cleanup' || 'build' }}
  # Cleanup runs must complete (a close event right after an unlabel queues
  # behind the running cleanup instead of canceling it mid-delete), and events
  # that skip the build job, such as adding an unrelated label, must not
  # cancel an in-flight build either.
  cancel-in-progress: ${{ !contains(fromJSON('["closed", "unlabeled"]'), github.event.action) && (github.event.action != 'labeled' || github.event.label.name == 'preview:mac') }}

jobs:
  # Builds run PR code, so this job keeps a read-only token. Publishing to the
  # release happens in the publish job below, which never checks out PR code.
  build:
    name: Build macOS Apple Silicon preview
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:mac') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:mac')
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      dmg_name: ${{ steps.build.outputs.dmg_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # Anonymous fetch avoids auth cleanup traversing orphaned submodule entries.
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin

      - id: version
        name: Set preview version and public configuration
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Fork branch pushes do not bring along upstream release tags.
          if [[ ! "$PREVIEW_BRANCH" =~ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a preview branch ending in vX.Y.Z." >&2
            exit 1
          fi
          release_tag="${BASH_REMATCH[1]}"
          git fetch --no-tags https://github.com/pingdotgg/t3code.git "refs/tags/${release_tag}:refs/tags/${release_tag}"
          git merge-base --is-ancestor "$release_tag" HEAD
          base_tag="$(git describe --tags --match 'v[0-9]*' --exclude '*-*' --abbrev=0)"
          base_version="${base_tag#v}"
          preview_version="${base_version}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
          node scripts/update-release-package-versions.ts "$preview_version"
          cp .env.example .env

          echo "version=$preview_version" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build unsigned macOS DMG
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "$PREVIEW_VERSION" \
            --verbose

          shopt -s nullglob
          dmg_files=(release/*.dmg)
          if (( ${#dmg_files[@]} != 1 )); then
            printf 'Expected one DMG, found %s.\n' "${#dmg_files[@]}" >&2
            exit 1
          fi
          printf 'dmg_name=%s\n' "$(basename "${dmg_files[0]}")" >> "$GITHUB_OUTPUT"

      # archive: false uploads the file as its own artifact named after the
      # file, so the publish job downloads by *.dmg pattern, not by name.
      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: release/*.dmg
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: 7

  # Publishers handle installer bytes without checking out or executing PR code.
  publish:
    name: Publish preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      PREVIEW_LABEL: preview:mac
      PREVIEW_PLATFORM: macos
      PREVIEW_EXTENSION: dmg
      PREVIEW_ARCH: arm64
      PREVIEW_TITLE: macOS preview
      PREVIEW_DOWNLOAD_LABEL: Apple Silicon DMG
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*.dmg"
          merge-multiple: true
          path: release

      - id: prepare
        name: Validate current preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA ||
                pr.head.repo?.full_name !== `${owner}/${repo}` ||
                !pr.labels.some(label => label.name === process.env.PREVIEW_LABEL)) {
              core.info('Preview is no longer current; skipping publication.');
              return;
            }
            const version = process.env.PREVIEW_VERSION;
            if (!new RegExp(`^\\d+\\.\\d+\\.\\d+-pr\\.${prNumber}\\.${context.runNumber}$`).test(version)) {
              throw new Error('Unexpected preview version.');
            }
            const name = `T3-Code-${version}-${process.env.PREVIEW_ARCH}.${process.env.PREVIEW_EXTENSION}`;
            const files = fs.readdirSync('release', { withFileTypes: true });
            if (files.length !== 1 || files[0].name !== name || !files[0].isFile()) {
              throw new Error('Expected exactly one regular installer for this preview.');
            }
            core.setOutput('path', `release/${name}`);
            core.setOutput('name', name);

      - name: Attest installer
        if: steps.prepare.outputs.path != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.prepare.outputs.path }}

      - name: Publish installer and comment
        if: steps.prepare.outputs.path != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INSTALLER_PATH: ${{ steps.prepare.outputs.path }}
          INSTALLER_NAME: ${{ steps.prepare.outputs.name }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;
            const label = process.env.PREVIEW_LABEL;
            const extension = `.${process.env.PREVIEW_EXTENSION}`;
            const tag = 'desktop-preview';
            const current = async () => {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              return pr.state === 'open' && pr.head.sha === process.env.HEAD_SHA &&
                pr.head.repo?.full_name === `${owner}/${repo}` && pr.labels.some(item => item.name === label);
            };
            if (!(await current())) return;

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                ({ data: release } = await github.rest.repos.createRelease({
                  owner, repo, tag_name: tag, target_commitish: context.payload.repository.default_branch,
                  name: 'Desktop preview builds', prerelease: true,
                  body: 'Desktop previews from pull requests. Downloads are removed when their PR closes or platform preview label is removed.',
                }));
              } catch (error) {
                if (error.status !== 422) throw error;
                // Mac and Windows can create the shared release concurrently.
                ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
              }
            }
            const remove = async id => {
              try { await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: id }); }
              catch (error) { if (error.status !== 404) throw error; }
            };
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            const name = process.env.INSTALLER_NAME;
            for (const asset of assets.filter(asset => asset.name === name)) await remove(asset.id);
            if (!(await current())) return;
            const { data: uploaded } = await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name,
              data: fs.readFileSync(process.env.INSTALLER_PATH),
              headers: { 'content-type': 'application/octet-stream' },
            });
            if (!(await current())) { await remove(uploaded.id); return; }
            for (const asset of assets) {
              if (asset.name !== name && asset.name.includes(`-pr.${prNumber}.`) && asset.name.endsWith(extension)) {
                await remove(asset.id);
              }
            }
            if (!(await current())) { await remove(uploaded.id); return; }

            const marker = `<!-- desktop-${process.env.PREVIEW_PLATFORM}-preview -->`;
            const buildUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${process.env.HEAD_SHA}`;
            const body = [
              marker, `### ${process.env.PREVIEW_TITLE}`, '',
              `[Download ${process.env.PREVIEW_DOWNLOAD_LABEL}](${uploaded.browser_download_url})`, '',
              `Version: ${process.env.PREVIEW_VERSION}`,
              `Commit: [${process.env.HEAD_SHA.slice(0, 7)}](${commitUrl})`,
              `[Build](${buildUrl})`, '',
              'Unsigned preview installer.',
              'No GitHub sign-in is needed to download.',
              'The download stays available until this PR closes or its platform preview label is removed.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (!(await current())) { await remove(uploaded.id); return; }
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

  cleanup:
    name: Remove platform preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview:mac')) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview:mac'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      PREVIEW_LABEL: preview:mac
      PREVIEW_PLATFORM: macos
      PREVIEW_EXTENSION: dmg
      PREVIEW_ARCH: arm64
      PREVIEW_TITLE: macOS preview
      PREVIEW_DOWNLOAD_LABEL: Apple Silicon DMG
    steps:
      - name: Remove downloads and update comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;
            const active = async () => {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              return pr.state === 'open' && pr.labels.some(label => label.name === process.env.PREVIEW_LABEL);
            };
            if (await active()) return;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'desktop-preview' }));
            } catch (error) { if (error.status !== 404) throw error; }
            if (release) {
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner, repo, release_id: release.id, per_page: 100,
              });
              for (const asset of assets) {
                if (!asset.name.includes(`-pr.${prNumber}.`) || !asset.name.endsWith(`.${process.env.PREVIEW_EXTENSION}`)) continue;
                if (await active()) return;
                try { await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id }); }
                catch (error) { if (error.status !== 404) throw error; }
              }
            }
            const marker = `<!-- desktop-${process.env.PREVIEW_PLATFORM}-preview -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (existing && !(await active())) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id,
                body: [marker, `### ${process.env.PREVIEW_TITLE}`, '',
                  'The preview download was removed because this PR closed or its platform preview label was removed.'].join('\n'),
              });
            }
